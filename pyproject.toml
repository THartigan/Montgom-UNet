[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "montgomery-unet"
version = "0.1.0"
description = "Montgomery chest X-ray data tools for UNet experiments"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
